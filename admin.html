<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aquapark Admin</title>

<style>
body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f8;
    padding: 40px;
}

.login, .admin {
    max-width: 600px;
    margin: 0 auto;
    background: #fff;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,.1);
}

h1 {
    text-align: center;
    margin-bottom: 25px;
}

input, textarea {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
}

button {
    width: 100%;
    padding: 14px;
    background: #0066cc;
    color: #fff;
    border: none;
    cursor: pointer;
    font-weight: bold;
}

button.red {
    background: #d9534f;
    margin-top: 10px;
}

.hidden {
    display: none;
}
</style>
</head>
<body>

<div class="login" id="login">
    <h1>ADMIN LOGIN</h1>
    <input type="password" id="pin" placeholder="PIN">
    <button onclick="login()">LOGIN</button>
</div>

<div class="admin hidden" id="admin">
    <h1>CMS DATA</h1>

    <textarea id="data" rows="15"></textarea>

    <button onclick="save()">SAVE</button>
    <button onclick="exportData()">EXPORT JSON</button>
    <button class="red" onclick="clearAll()">CLEAR ALL</button>
</div>

<script>
const PIN = "1234";

function login() {
    const val = document.getElementById('pin').value;
    if (val === PIN) {
        document.getElementById('login').classList.add('hidden');
        document.getElementById('admin').classList.remove('hidden');
        load();
    } else {
        alert('WRONG PIN');
    }
}

function load() {
    const data = {
        cms: JSON.parse(localStorage.getItem('cms') || '{}'),
        images: JSON.parse(localStorage.getItem('cms_images') || '{}'),
        gallery: JSON.parse(localStorage.getItem('cms_gallery') || '[]'),
        lang: localStorage.getItem('lang')
    };
    document.getElementById('data').value = JSON.stringify(data, null, 2);
}

function save() {
    try {
        const parsed = JSON.parse(document.getElementById('data').value);
        localStorage.setItem('cms', JSON.stringify(parsed.cms || {}));
        localStorage.setItem('cms_images', JSON.stringify(parsed.images || {}));
        localStorage.setItem('cms_gallery', JSON.stringify(parsed.gallery || []));
        if (parsed.lang) localStorage.setItem('lang', parsed.lang);
        alert('SAVED');
    } catch {
        alert('INVALID JSON');
    }
}

function exportData() {
    const blob = new Blob([document.getElementById('data').value], {type: 'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'aquapark_backup.json';
    a.click();
}

function clearAll() {
    if (confirm('DELETE EVERYTHING?')) {
        localStorage.clear();
        document.getElementById('data').value = '';
    }
}
</script>

</body>
</html>
