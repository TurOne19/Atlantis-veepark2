<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <title>Admin – Calendar</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<section class="calendar-section">
  <h2 class="calendar-title">Kalendri haldus</h2>

  <div class="calendar-card">
    <div class="calendar-header">
      <button id="calPrev" class="cal-arrow">‹</button>
      <div id="calMonth" class="cal-month"></div>
      <button id="calNext" class="cal-arrow">›</button>
    </div>

    <div class="calendar-weekdays">
      <span>E</span><span>T</span><span>K</span><span>N</span>
      <span>R</span><span>L</span><span>P</span>
    </div>

    <div id="calendarGrid" class="calendar-grid"></div>

    <div class="admin-controls">
      <p><strong>Vali päev → vali staatus</strong></p>

      <div class="admin-buttons">
        <button data-type="closed" class="btn closed">Suletud</button>
        <button data-type="short" class="btn short">10:00–18:00</button>
        <button data-type="normal" class="btn normal">10:00–22:00</button>
        <button data-type="late" class="btn late">14:00–22:00</button>
        <button data-type="extended" class="btn extended">10:00–21:00</button>
      </div>

      <button id="saveCalendar" class="btn btn-primary">
        Salvesta kalender
      </button>
    </div>
  </div>
</section>

<script src="../js/admin-calendar.js"></script>
</body>
</html>
